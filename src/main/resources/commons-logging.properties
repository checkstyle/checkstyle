# Checkstyle configures java.util.logging directly (see Main "-d" option), so pin
# commons-logging to its classic discovery (Jdk14Logger). Without this,
# commons-logging 1.3+ auto-detects the SLF4J API that Checkstyle ships for
# org.reflections and would silently route Checkstyle's own logging to slf4j-simple.
# priority=-1 (missing key counts as 0, ties resolved by classpath order) lets any
# commons-logging.properties provided by users take precedence.
org.apache.commons.logging.LogFactory=org.apache.commons.logging.impl.LogFactoryImpl
priority=-1
