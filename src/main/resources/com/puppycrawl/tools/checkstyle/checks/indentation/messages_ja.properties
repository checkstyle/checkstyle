openjdk.throws.indentation=''throws''句は、メソッド宣言または前の行を基準に8スペースインデントし、前の行と揃えてはなりません。
openjdk.throws.new.line=メソッド宣言が複数行にわたる場合、''throws''句は新しい行に配置する必要があります。
