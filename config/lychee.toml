# Suppressions for lychee link checker
exclude = [
  "https://twitter.com/.*",
  "https://stackoverflow.com/.*",
  "http://dl.acm.org/.*",
  "https://www.w3.org/.*",
  "https://github.com/.*search.*",
  "https://github.com/search.*",
  # Auto-generated by Maven from dependencies (not fixable in source)
  "https://bytebuddy.net/.*",
  # Snapshot release links (don't exist in GitHub releases)
  "https://github.com/checkstyle/checkstyle/releases/download/.*SNAPSHOT/.*",
  # External site 404s (truly broken external sites)
  "https://oss.sonatype.org/.*",
  "http://tide.olympe.in/.*",
  "https://bitbucket.org/atlassian/bamboo-checkstyle-plugin",
  "https://marketplace.visualstudio.com/.*",
  "https://medium.com/.*",
  "http://www.mojohaus.org/.*",
  "https://www.mojohaus.org/.*",
  "https://github.com/groupon/json-schema-validator",
  "https://www.antlr.org/antlr4-maven-plugin/.*",
  # Old deleted GitHub issues
  "https://github.com/checkstyle/checkstyle/issues/2728",
  "https://github.com/checkstyle/checkstyle/issues/2788",
  # OpenCollective returns 403 to automated link checkers
  "https://opencollective.com/.*",
]

# Timeout for each link check (in seconds)
timeout = 10

# Maximum number of retries for failed requests
max_retries = 2

# Retry wait time (in seconds)
retry_wait_time = 2
