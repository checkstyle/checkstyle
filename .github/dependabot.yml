version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: org.apache.maven.plugins:maven-release-plugin
        versions:
          - "> 2.1"
    commit-message:
      prefix: dependency
    groups:
      rewrite:
        patterns:
          - "*rewrite*"
      byte-buddy:
        patterns:
          - "net.bytebuddy:byte-buddy"
          - "net.bytebuddy:byte-buddy-agent"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: dependency
