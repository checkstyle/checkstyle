name: IDEA inspections
on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: none
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Qodana Scan
        uses: JetBrains/qodana-action@v2026.2.0
        with:
          use-caches: false
          use-annotations: false
          pr-mode: false

          args: --config config/qodana.yml --print-problems

      - name: Brief Report
        if: always()
        run: |
          .ci/print-brief-qodana-report.sh "${{ runner.temp }}/qodana/results/qodana.sarif.json"
