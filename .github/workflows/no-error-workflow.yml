name: 'no-error testing'

on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-error-kafka:
    if: github.event.action != 'closed' && github.repository == 'checkstyle/checkstyle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup local maven cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: checkstyle-maven-cache-${{ hashFiles('**/pom.xml') }}

      - name: Run Checkstyle on Apache Kafka
        run: ./.ci/validation.sh no-error-kafka

  no-error-trino:
    if: github.event.action != 'closed' && github.repository == 'checkstyle/checkstyle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 23

      - name: Setup local maven cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: checkstyle-maven-cache-${{ hashFiles('**/pom.xml') }}

      - name: Run Checkstyle on Trino
        run: ./.ci/validation.sh no-error-trino
