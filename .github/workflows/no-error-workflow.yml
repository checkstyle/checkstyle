name: 'no-error testing'

on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-error-kafka:
    if: github.event.action != 'closed' && github.repository == 'checkstyle/checkstyle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - name: Run Checkstyle on Apache Kafka
        run: ./.ci/validation.sh no-error-kafka

  no-error-trino:
    if: github.event.action != 'closed' && github.repository == 'checkstyle/checkstyle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 23

      - name: Run Checkstyle on Trino
        run: ./.ci/validation.sh no-error-trino
