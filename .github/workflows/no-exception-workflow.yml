name: "no-exception testing"

on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # this execution should stay on GitHub actions due to time/ memory limits in other CI
  no-exception-openjdk17:
    if: github.event.action != 'closed' && github.repository == 'checkstyle/checkstyle'
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Install Groovy
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors --fail-with-body -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install groovy
          echo "$HOME/.sdkman/candidates/groovy/current/bin" >> "$GITHUB_PATH"
          groovy --version

      - name: Checkout repository
        uses: actions/checkout@v7

      - run: .ci/no-exception-test.sh openjdk17-with-checks-nonjavadoc-error
  # this execution should stay on GitHub actions due to time/ memory limits in other CI
  no-exception-openjdk19:
    if: github.event.action != 'closed' && github.repository == 'checkstyle/checkstyle'
    runs-on: ubuntu-latest
