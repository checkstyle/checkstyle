name: Pitest

on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.action != 'closed' && github.repository == 'checkstyle/checkstyle'
    strategy:
      matrix:
        profile:
          - annotation
          - ant
          - api
          - blocks
          - coding-1
          - coding-2
          - coding-require-this-check
          - common
          - common-2
          - design
          - filters
          - header
          - imports
          - indentation
          - javadoc
          - main
          - metrics
          - misc
          - modifier
          - modules
          - naming
          - packagenamesloader
          - regexp
          - sizes
          - tree-walker
          - utils
          - whitespace
          - xpath
          - java-ast-visitor
          # GUI package needs better test coverage before adding to execution.
          # - gui
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Install Groovy
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if (
              curl --fail-with-body -sS "https://get.sdkman.io" | bash \
                && source "$HOME/.sdkman/bin/sdkman-init.sh" \
                && sdk install groovy \
                && groovy --version
            ); then
              echo "$HOME/.sdkman/candidates/groovy/current/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Groovy setup failed (attempt $attempt/3); retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "Groovy setup failed after 3 attempts." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup local maven cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: checkstyle-maven-cache-${{ hashFiles('**/pom.xml') }}

      - name: Generate pitest-${{ matrix.profile }} report
        run: |
          ./.ci/pitest.sh "pitest-${{ matrix.profile }}"

      - name: Patch command for pitest-${{ matrix.profile }}
        if: failure()
        run: |
          ./.ci/print-diff-as-patch.sh target/pitest-${{ matrix.profile }}.patch

      - name: Stage results
        if: failure() || github.ref == 'refs/heads/master'
        run: |
          mkdir staging && cp -r target/pit-reports/ staging

      - name: Archive code coverage results
        if: failure() || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: pitest-${{ matrix.profile }}-coverage-report
          path: |
            staging
            target/pitest-${{ matrix.profile }}.patch
          retention-days: 7
